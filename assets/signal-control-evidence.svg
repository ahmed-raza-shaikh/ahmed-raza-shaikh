<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Signal, control, evidence</title>
  <desc id="desc">A three-stage cloud-security operating model: detect signal, apply control, and produce evidence.</desc>
  <rect width="1200" height="360" fill="#0D1117" rx="24"/>
  <path d="M278 180H454M746 180H922" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
  <circle cx="278" cy="180" r="10" fill="#2DD4BF"/><circle cx="454" cy="180" r="10" fill="#60A5FA"/><circle cx="746" cy="180" r="10" fill="#60A5FA"/><circle cx="922" cy="180" r="10" fill="#FBBF24"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="190" y="130" fill="#2DD4BF" font-size="18" font-weight="700" letter-spacing="3">SIGNAL</text>
    <text x="190" y="174" fill="#E6EDF3" font-size="32" font-weight="700">Find what matters</text>
    <text x="190" y="212" fill="#8B949E" font-size="18">Posture · telemetry · risk</text>
    <text x="600" y="130" fill="#60A5FA" font-size="18" font-weight="700" letter-spacing="3">CONTROL</text>
    <text x="600" y="174" fill="#E6EDF3" font-size="32" font-weight="700">Make recurrence harder</text>
    <text x="600" y="212" fill="#8B949E" font-size="18">IAM · guardrails · secure delivery</text>
    <text x="1010" y="130" fill="#FBBF24" font-size="18" font-weight="700" letter-spacing="3">EVIDENCE</text>
    <text x="1010" y="174" fill="#E6EDF3" font-size="32" font-weight="700">Show the control worked</text>
    <text x="1010" y="212" fill="#8B949E" font-size="18">Detection · audit trail · reporting</text>
  </g>
  <text x="600" y="305" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" text-anchor="middle">Ahmed Raza Shaikh · cloud security systems that reduce risk and make assurance continuous</text>
</svg>
